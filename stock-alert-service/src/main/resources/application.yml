server:
  port: 8080

spring:
  application:
    name: stock-alert-service
  datasource:
    url: jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom config for stock streaming
stream:
  provider: finnhub
  finnhub:
    websocket-url: "wss://ws.finnhub.io?token=${FINNHUB_API_KEY}"
